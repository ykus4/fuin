site_name: fuin
site_description: Android APK Packer — protect bytecode, block cheating, resist reverse engineering
site_url: https://ykus4.github.io/fuin
repo_url: https://github.com/ykus4/fuin
repo_name: ykus4/fuin
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  logo: logo.png
  favicon: logo.png
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ykus4/fuin

nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
  - Guide:
      - Web UI: guide/web-ui.md
      - CLI: guide/cli.md
      - REST API: guide/rest-api.md
      - Gradle plugin: guide/gradle-plugin.md
      - GitHub Action: guide/github-actions.md
  - Reference:
      - Configuration: reference/configuration.md
      - API: reference/api.md
      - Architecture: reference/architecture.md
  - Security:
      - Protection layers: security/protection-layers.md
      - Threat model: security/threat-model.md
  - Development: development/index.md
